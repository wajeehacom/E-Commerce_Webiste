{% extends 'store/base.html' %}

{% block title %}VibeCart | Password Reset Success{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<div class="container mt-5 py-5 px-4 px-lg-5 shadow-lg text-center" 
     style="background: rgba(0,0,0,0.9); border: 2px solid var(--vibe-yellow); border-radius: 20px; max-width: 600px;">
    
    <div class="row justify-content-center">
        <div class="col-lg-10">
            
            <div class="mb-4">
                <div class="vibe-success-ring shadow-sm">
                    <i class="bi bi-shield-check display-1 text-dark"></i>
                </div>
            </div>

            <h1 class="fw-bold text-uppercase mb-3" style="color: var(--vibe-yellow); letter-spacing: 2px;">
                All Set!
            </h1>
            
            <p class="text-white fw-bold mb-4 fs-5">Password Reset Successfully ✅</p>
            
            <p class="text-white-50 mb-5 px-md-3">
                Your account is now secure. You can now log in to <strong>VibeCart</strong> using your new password.
            </p>
            
            <div class="d-grid gap-3">
                <a href="{% url 'login' %}" class="btn btn-warning btn-lg fw-bold py-3 text-dark rounded-0 shadow btn-vibe-login">
                    LOGIN NOW <i class="bi bi-arrow-right ms-2"></i>
                </a>
            </div>

            <div class="mt-5 pt-4 border-top border-secondary">
                <p class="text-white-50 small mb-0">
                    Back to <a href="/" class="text-warning text-decoration-none fw-bold">Home Page</a>
                </p>
            </div>

        </div>
    </div>
</div>

<style>
    .vibe-success-ring {
        width: 120px;
        height: 120px;
        background: var(--vibe-yellow);
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 10px;
        border: 5px solid #fff;
        animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes scaleIn {
        0% { transform: scale(0); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }

    .btn-vibe-login:hover {
        background-color: #ffffff !important;
        border-color: #ffffff !important;
        transform: translateY(-3px);
        transition: 0.3s ease-in-out;
    }

    .text-warning:hover {
        color: #fff !important;
    }
</style>
{% endblock %}
