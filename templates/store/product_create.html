{% extends 'store/base.html' %}
{% block content %}

<style>
    .form-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 70vh; 
        padding: 20px;
    }

    .custom-form {
        background: #f9f9f9;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px; 
    }

    .custom-form h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
    }

    .custom-form button {
        width: 100%;
        padding: 10px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
    }

    .custom-form button:hover {
        background-color: #218838;
    }

    .back-link {
        display: block;
        text-align: center;
        margin-top: 15px;
        text-decoration: none;
        color: #007bff;
    }
</style>

<div class="form-container">
    <div class="custom-form">
        <h2>Add Product</h2>
        
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Add Product</button>
        </form>

        <a href="{% url 'product_list' %}" class="back-link">Back to Products</a>
    </div>
</div>

{% endblock %}
